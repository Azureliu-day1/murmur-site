<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- CSP 与站内各页同一套(SEC-L5,无 unsafe-inline):样式在 thanks.css,脚本在 thanks.js;
     字体走本站 /fonts/(v2.css 里的 @font-face),不再连 Google Fonts。这一页一个请求都不发(connect-src 'none')。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>付款成功 · Murmur</title>
<link rel="canonical" href="https://maobenbeginner.com/thanks/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Murmur">
<meta property="og:locale" content="zh_CN">
<meta property="og:url" content="https://maobenbeginner.com/thanks/">
<meta property="og:title" content="付款成功 · Murmur">
<meta property="og:description" content="付款成功。回到 Murmur,档位会自动更新。">
<meta property="og:image" content="https://maobenbeginner.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Murmur · Mac 上的语音输入">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../v2.css">
<link rel="stylesheet" href="thanks.css">
</head>
<body>

<div class="card">
  <p class="eyebrow">Murmur</p>

  <div class="tick" aria-hidden="true">
    <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
      <path d="M3.5 9l3.2 3.2L13.5 5.4" stroke="#fff" stroke-width="2.1"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>付款成功</h1>

  <!-- 自定义 scheme 不能靠自动跳转:浏览器会拦、也可能弹一个吓人的确认框。
       主路径是这个按钮(用户的点击就是那个必需的手势)。App 收到 murmur://upgraded 后刷新 /me。 -->
  <a class="back" id="back" href="murmur://upgraded">回到 Murmur</a>

  <p class="note" id="hint">如果 App 里没变,用付款邮箱登录一次。</p>

  <hr>

  <p class="note">
    登录邮箱和付款邮箱不一样时,订阅对不上。这时写信到
    <a class="plainlink" href="mailto:contact@maobenbeginner.com">contact@maobenbeginner.com</a>,我们手动处理。
  </p>
</div>

<script src="thanks.js"></script>
</body>
</html>
